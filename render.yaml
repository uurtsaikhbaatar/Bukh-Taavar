# Render Blueprint (bigtwo-ийн загвар). Repo-г Render-т холбоход энэ файлыг
# уншиж үйлчилгээг тохируулна. Файл repo-гийн үндэс дээр байх ёстой.
#
# Орчны хувьсагчийг Render-ийн Dashboard дээр гараар оруулна (нууц):
#   DATABASE_URL     — Neon Postgres холболтын мөр
#   EMAIL_PROVIDER   — brevo
#   EMAIL_API_KEY    — Brevo API key (xkeysib-…)
#   EMAIL_FROM       — "Бөхийн таавар <noreply@…>"  (Brevo дээр баталгаажсан хаяг)
#   SECURE_COOKIES   — 1
#   DEVJEE_FIREBASE_KEY — (заавал биш) devjee-ийн нийтийн Firebase key; байхгүй бол өөрөө олно
services:
  - type: web
    name: bukh-taavar
    runtime: docker
    plan: starter         # $7/сар, унтардаггүй (0.5 CPU / 512 MB) — 2026-09-06 эзний зөвшөөрлөөр; Blueprint managed тул энд free гэж буцаавал дараагийн push дээр даунгрейд хийнэ гэдгийг анхаар
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECURE_COOKIES
        value: "1"
